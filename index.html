<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pann · Interactive Web3 Music Player | Pradeep Kumar</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body>
    <div class="player-container">
        <header class="app-header">
            <div class="brand">
                <h1>PANN</h1>
                <span class="sub-title">by Pradeep Kumar</span>
            </div>
            <button id="connect-wallet-btn" class="btn-wallet" onclick="connectWallet()">
                <span class="wallet-icon">🦊</span>
                <span id="wallet-btn-text">Connect Wallet</span>
            </button>
        </header>

        <div class="mix-mode-bar">
            <div class="mode-toggle-group">
                <button id="mode-global-btn" class="mode-btn active" onclick="setMixMode('global')">
                    <span class="live-dot"></span> 🌐 Live Global Master
                </button>
                <button id="mode-local-btn" class="mode-btn" onclick="setMixMode('local')">
                    🎛️ My Custom Mix
                </button>
            </div>
            <button id="reset-global-btn" class="reset-btn hidden" onclick="resetToGlobalMix()">
                ↩ Reset to Global State
            </button>
        </div>

        <div id="owner-summary-bar" class="owner-summary-bar hidden">
            <div class="owner-status">
                <span class="owner-badge">✦ CONNECTED LAYER OWNER</span>
                <span id="owner-wallet-address" class="wallet-address">0x000...000</span>
            </div>
            <div id="owned-layers-list" class="owned-layers-list"></div>
        </div>

        <div class="artwork-canvas-container">
            <div class="artwork-layer-preview">
                <div id="art-layer-strings" class="art-layer layer-strings"></div>
                <div id="art-layer-winds" class="art-layer layer-winds"></div>
                <div id="art-layer-rhythm" class="art-layer layer-rhythm"></div>
                <div id="art-layer-ambience" class="art-layer layer-ambience"></div>
            </div>
            <div class="live-status-pill">
                <span class="status-indicator"></span>
                <span id="current-mode-label">BROADCASTING GLOBAL MASTER</span>
            </div>
        </div>

        <main class="stems-grid">
            <div class="stem-card" data-layer="strings" id="stem-card-strings">
                <div class="stem-header">
                    <label for="select-strings">Strings</label>
                    <span class="stem-status" id="status-strings">Global</span>
                </div>
                <select id="select-strings" onchange="onDropdownChange('strings', this.value)">
                    <option value="1">Acoustic Veena</option>
                    <option value="2">Electric Violin</option>
                    <option value="3">Sitar Resonance</option>
                </select>
                <button id="publish-strings-btn" class="btn-publish hidden" onclick="publishLayerStateOnChain('strings', 1)">
                    ✦ Publish to Blockchain
                </button>
            </div>

            <div class="stem-card" data-layer="winds" id="stem-card-winds">
                <div class="stem-header">
                    <label for="select-winds">Winds</label>
                    <span class="stem-status" id="status-winds">Global</span>
                </div>
                <select id="select-winds" onchange="onDropdownChange('winds', this.value)">
                    <option value="1">Bamboo Flute</option>
                    <option value="2">Nadaswaram</option>
                    <option value="3">Shehnai Echo</option>
                </select>
                <button id="publish-winds-btn" class="btn-publish hidden" onclick="publishLayerStateOnChain('winds', 2)">
                    ✦ Publish to Blockchain
                </button>
            </div>

            <div class="stem-card" data-layer="rhythm" id="stem-card-rhythm">
                <div class="stem-header">
                    <label for="select-rhythm">Rhythm</label>
                    <span class="stem-status" id="status-rhythm">Global</span>
                </div>
                <select id="select-rhythm" onchange="onDropdownChange('rhythm', this.value)">
                    <option value="1">Mridangam Folk</option>
                    <option value="2">Kanjira Pulse</option>
                    <option value="3">Electronic Beat</option>
                </select>
                <button id="publish-rhythm-btn" class="btn-publish hidden" onclick="publishLayerStateOnChain('rhythm', 3)">
                    ✦ Publish to Blockchain
                </button>
            </div>

            <div class="stem-card" data-layer="ambience" id="stem-card-ambience">
                <div class="stem-header">
                    <label for="select-ambience">Ambience</label>
                    <span class="stem-status" id="status-ambience">Global</span>
                </div>
                <select id="select-ambience" onchange="onDropdownChange('ambience', this.value)">
                    <option value="1">Temple Drone</option>
                    <option value="2">Monsoon Rain</option>
                    <option value="3">Cosmic Synth</option>
                </select>
                <button id="publish-ambience-btn" class="btn-publish hidden" onclick="publishLayerStateOnChain('ambience', 4)">
                    ✦ Publish to Blockchain
                </button>
            </div>
        </main>

        <footer class="transport-bar">
            <button id="play-pause-btn" class="btn-play" onclick="togglePlayback()">▶ Play</button>
            <div class="progress-container">
                <span id="time-current">0:00</span>
                <input type="range" id="seek-slider" min="0" max="100" value="0" oninput="seekAudio(this.value)">
                <span id="time-total">3:45</span>
            </div>
            <div class="volume-container">
                <span class="vol-icon">🔊</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" oninput="adjustVolume(this.value)">
            </div>
        </footer>
    </div>

    <audio id="audio-strings" loop></audio>
    <audio id="audio-winds" loop></audio>
    <audio id="audio-rhythm" loop></audio>
    <audio id="audio-ambience" loop></audio>

    <script src="app.js"></script>
</body>
</html>
